version: 2

# These are the three consumers described in the exercise.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily order counts and sales revenue including VAT by channel. Sales revenue including VAT is gross_revenue_eur minus refunded_eur."

  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: Paul Girard
      email: paul.girard@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly sum of net_revenue_eur by order_date, after refunds and excluding VAT. Uses the lab's fixed 20% VAT assumption."

  - name: churn_prediction_model
    label: Churn prediction model
    type: ml
    maturity: medium
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Customer retention model using last_order_date, lifetime_orders and lifetime_net_revenue_eur. The company churn definition uses 12 months."
